<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#2945a8" />
<title>POKÉ MINI — Pixel Pokédex</title>
<style>
:root{
  --sky:#2945a8;
  --sky-mid:#3f68b7;
  --sky-light:#5f8dca;
  --cloud:#c4d2df;
  --paper:#eaf0f1;
  --paper-2:#d7e1e8;
  --ink:#303247;
  --ink-soft:#515775;
  --line:#738fc2;
  --white:#f7faf9;
  --pixel:4px;
}
*{box-sizing:border-box}
html{background:var(--sky)}
body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Noto Sans Mono CJK JP",monospace;
  background:
    linear-gradient(180deg,var(--sky) 0 34%,var(--sky-mid) 62%,var(--sky-light) 100%);
  overflow-x:hidden;
}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--white);outline-offset:3px}

/* reference-inspired pixel sky */
.scene{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.scene::before{
  content:"";
  position:absolute;
  left:-7vw;right:-7vw;top:31vh;height:38vh;
  opacity:.48;
  background:
    radial-gradient(circle,var(--cloud) 1.6px,transparent 1.8px) 0 0/10px 10px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 76%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 76%,transparent 100%);
  transform:skewY(3deg);
}
.cloud{
  position:absolute;
  background:var(--cloud);
  opacity:.88;
  filter:none;
  clip-path:polygon(9% 32%,18% 32%,18% 22%,27% 22%,27% 10%,37% 10%,37% 3%,49% 3%,49% 9%,61% 9%,61% 18%,71% 18%,71% 31%,82% 31%,82% 42%,91% 42%,91% 70%,82% 70%,82% 80%,66% 80%,66% 88%,52% 88%,52% 95%,35% 95%,35% 89%,20% 89%,20% 80%,10% 80%,10% 69%,3% 69%,3% 46%,9% 46%);
}
.cloud.one{width:360px;height:220px;left:-100px;top:42vh}
.cloud.two{width:250px;height:150px;right:-70px;top:56vh;opacity:.63}
.wire{position:absolute;left:-5%;right:-5%;top:47%;height:4px;background:var(--ink);opacity:.42;transform:rotate(-7deg);box-shadow:0 8px 0 rgba(48,50,71,.15)}
.pole{position:absolute;right:18%;top:49%;width:13px;height:58vh;background:var(--ink);opacity:.38;box-shadow:9px 0 0 rgba(48,50,71,.15)}
.pole::before{content:"";position:absolute;left:-34px;top:12px;width:82px;height:10px;background:var(--ink)}

.wrap{position:relative;z-index:1;width:min(100%,900px);margin:auto;padding:24px 14px 72px}
.pixel-box{
  border:4px solid var(--ink);
  box-shadow:6px 6px 0 rgba(24,27,48,.38);
  clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,100% 4px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) 100%,8px 100%,8px calc(100% - 4px),0 calc(100% - 4px),0 8px,4px 8px,4px 4px,8px 4px);
}
.hero{padding:8px 2px 24px;color:var(--paper)}
.eyebrow{font-size:10px;letter-spacing:.18em;opacity:.78;margin-bottom:7px}
.logo{font-size:clamp(31px,9vw,54px);font-weight:900;line-height:.92;letter-spacing:-.08em;text-shadow:4px 4px 0 var(--ink)}
.logo .mini{color:var(--cloud)}
.sub{margin-top:12px;font-size:12px;line-height:1.7;color:#d5e0ea;text-shadow:2px 2px 0 rgba(48,50,71,.38)}

.search{position:sticky;top:0;z-index:8;padding:8px 0 14px;background:linear-gradient(180deg,rgba(41,69,168,.97) 0,rgba(41,69,168,.91) 68%,transparent 100%)}
.searchbox{display:grid;grid-template-columns:1fr auto;background:var(--paper);padding:6px;border:4px solid var(--ink);box-shadow:5px 5px 0 rgba(24,27,48,.4)}
.searchbox::before{content:">";align-self:center;padding:0 4px 0 6px;font-weight:900;color:var(--sky)}
.searchbox{grid-template-columns:auto 1fr auto}
.searchbox input{min-width:0;border:0;background:transparent;color:var(--ink);outline:0;padding:10px 4px;font-size:13px}
.searchbox input::placeholder{color:#7b819a}
.searchbox button{border:0;border-left:4px solid var(--ink);background:var(--sky-mid);color:var(--white);padding:8px 12px;font-weight:900;letter-spacing:.05em;box-shadow:inset -4px -4px 0 rgba(48,50,71,.23)}
.searchbox button:active{transform:translate(2px,2px);box-shadow:inset 2px 2px 0 rgba(48,50,71,.22)}
.error{display:none;margin-top:8px;padding:9px 10px;border:3px solid var(--ink);background:#d5b6c9;color:#342f45;font-size:11px;line-height:1.5;box-shadow:4px 4px 0 rgba(24,27,48,.35)}

.section-head{display:flex;align-items:end;justify-content:space-between;margin:12px 2px 12px;color:var(--paper)}
.section-head h2{font-size:14px;margin:0;letter-spacing:.06em;text-shadow:2px 2px 0 rgba(48,50,71,.48)}
.section-head small{font-size:9px;letter-spacing:.08em;color:#cfdae6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{
  position:relative;
  min-width:0;
  border:4px solid var(--ink);
  background:var(--paper);
  padding:8px;
  text-align:left;
  color:var(--ink);
  box-shadow:6px 6px 0 rgba(24,27,48,.42);
  clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,100% 4px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) 100%,8px 100%,8px calc(100% - 4px),0 calc(100% - 4px),0 8px,4px 8px,4px 4px,8px 4px);
  transition:transform .08s linear,box-shadow .08s linear,background .08s linear;
}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.22),transparent 38%,rgba(41,69,168,.08));mix-blend-mode:multiply}
.card:active{transform:translate(4px,4px);box-shadow:2px 2px 0 rgba(24,27,48,.42);background:#dce7ec}
.art{
  position:relative;
  aspect-ratio:1/1;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    linear-gradient(90deg,transparent 75%,rgba(48,50,71,.08) 75%) 0 0/8px 8px,
    linear-gradient(0deg,transparent 75%,rgba(48,50,71,.08) 75%) 0 0/8px 8px,
    var(--cloud);
  border:3px solid var(--ink);
}
.art::before{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;background:repeating-linear-gradient(90deg,var(--sky-light) 0 5px,transparent 5px 10px);opacity:.45}
.art img{position:relative;z-index:1;width:78%;height:78%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(4px 4px 0 rgba(48,50,71,.28))}
.num{color:var(--sky-mid);font-size:9px;font-weight:900;margin-top:8px;letter-spacing:.04em}
.name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.en{color:var(--ink-soft);font-size:9px;margin-top:2px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.types{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.pill{font-size:8px;font-weight:900;padding:4px 6px;border:2px solid var(--ink);background:#b8cade;color:var(--ink);line-height:1;box-shadow:2px 2px 0 rgba(48,50,71,.18)}
.loading,.empty{grid-column:1/-1;text-align:center;color:var(--paper);padding:44px 10px;font-size:11px;text-shadow:2px 2px 0 rgba(48,50,71,.45)}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(24,27,48,.68);display:none;align-items:flex-end;justify-content:center;padding-top:28px}
.overlay.show{display:flex}
.sheet{
  width:min(100%,720px);
  max-height:92vh;
  overflow:auto;
  background:var(--paper);
  border:4px solid var(--ink);
  border-bottom:0;
  padding:10px 14px calc(28px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 0 rgba(24,27,48,.26);
}
.handle{width:58px;height:5px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 10px);margin:0 auto 8px;opacity:.5}
.close{float:right;border:3px solid var(--ink);background:var(--sky-mid);color:var(--white);width:36px;height:36px;font-weight:900;line-height:28px;padding:0;box-shadow:3px 3px 0 rgba(48,50,71,.28)}
.close:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(48,50,71,.28)}
.detail-top{clear:both;display:grid;grid-template-columns:44% 1fr;gap:13px;align-items:center;padding-top:6px}
.detail-img{
  position:relative;
  aspect-ratio:1;
  display:grid;
  place-items:center;
  overflow:hidden;
  border:4px solid var(--ink);
  background:
    radial-gradient(circle,var(--sky-light) 1.2px,transparent 1.4px) 0 0/8px 8px,
    var(--cloud);
}
.detail-img img{width:82%;height:82%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(5px 5px 0 rgba(48,50,71,.25))}
.detail h1{margin:3px 0 0;font-size:clamp(20px,7vw,30px);line-height:1.05}
.detail .meta{color:var(--ink-soft);font-size:10px;margin-top:5px;text-transform:uppercase;letter-spacing:.08em}
.flavor{margin:14px 0 0;padding:10px 11px;border:3px solid var(--ink);background:#d9e3e9;font-size:11px;line-height:1.8;box-shadow:4px 4px 0 rgba(48,50,71,.18)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
.fact{border:3px solid var(--ink);background:#c6d5e1;padding:9px;box-shadow:3px 3px 0 rgba(48,50,71,.18)}
.fact b{display:block;font-size:8px;color:var(--ink-soft);margin-bottom:4px;letter-spacing:.08em}
.fact span{font-weight:900;font-size:12px}
.stats{margin-top:14px;border-top:4px solid var(--ink);padding-top:12px}
.stats h3{font-size:11px;margin:0 0 10px;letter-spacing:.08em}
.stat{display:grid;grid-template-columns:72px 32px 1fr;align-items:center;gap:7px;margin:8px 0;font-size:9px}
.stat b{text-align:right;font-size:10px}
.bar{height:11px;border:2px solid var(--ink);background:#b9c5d0;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--sky-mid) 0 6px,var(--sky) 6px 9px)}
.footer{margin-top:22px;text-align:right;color:#cfdae6;font-size:8px;letter-spacing:.12em;text-shadow:1px 1px 0 rgba(48,50,71,.5)}

@media(min-width:620px){
  .wrap{padding:38px 20px 80px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .card{padding:9px}
  .overlay{align-items:center;padding:24px}
  .sheet{border-bottom:4px solid var(--ink);max-height:88vh;padding:12px 18px 28px}
  .detail-top{grid-template-columns:260px 1fr;gap:22px}
  .cloud.one{width:520px;height:300px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="cloud one"></div>
  <div class="cloud two"></div>
  <div class="wire"></div>
  <div class="pole"></div>
</div>

<main class="wrap">
  <header class="hero">
    <div class="eyebrow">POCKET DATABASE / 10 SELECTED</div>
    <div class="logo">POKÉ <span class="mini">MINI</span></div>
    <div class="sub">青い空のポケット図鑑。<br>かわいいポケモンを、ドットで眺める。</div>
  </header>

  <div class="search">
    <form class="searchbox" id="searchForm">
      <input id="searchInput" autocomplete="off" placeholder="English name / No." aria-label="ポケモンを検索">
      <button>SEARCH</button>
    </form>
    <div class="error" id="error"></div>
  </div>

  <div class="section-head">
    <h2>かわいい 10 匹</h2>
    <small>SELECT → DETAIL</small>
  </div>
  <section class="grid" id="grid"><div class="loading">LOADING POKÉMON...</div></section>
  <div class="footer">POKÉ MINI / v2</div>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="ポケモン詳細">
  <article class="sheet">
    <div class="handle"></div>
    <button class="close" id="close" aria-label="閉じる">×</button>
    <div id="detail" class="detail"></div>
  </article>
</div>

<script>
const API='https://pokeapi.co/api/v2';
const PICKS=['pikachu','eevee','vulpix','jigglypuff','clefairy','togepi','skitty','pachirisu','emolga','sylveon'];
const TYPE={normal:'ノーマル',fire:'ほのお',water:'みず',electric:'でんき',grass:'くさ',ice:'こおり',fighting:'かくとう',poison:'どく',ground:'じめん',flying:'ひこう',psychic:'エスパー',bug:'むし',rock:'いわ',ghost:'ゴースト',dragon:'ドラゴン',dark:'あく',steel:'はがね',fairy:'フェアリー'};
const STAT={hp:'HP',attack:'こうげき',defense:'ぼうぎょ','special-attack':'とくこう','special-defense':'とくぼう',speed:'すばやさ'};
const cache=new Map();
const $=s=>document.querySelector(s);
const grid=$('#grid'),overlay=$('#overlay'),detail=$('#detail'),error=$('#error');

function sprite(p){
  return p.sprites.front_default || p.sprites.versions?.['generation-v']?.['black-white']?.animated?.front_default || '';
}

async function getPokemon(q){
  q=String(q).trim().toLowerCase();
  if(cache.has(q)) return cache.get(q);
  const r=await fetch(`${API}/pokemon/${encodeURIComponent(q)}`);
  if(!r.ok) throw new Error('not found');
  const p=await r.json();
  const s=await fetch(p.species.url).then(r=>r.json());
  const jp=s.names.find(n=>n.language.name==='ja')?.name||p.name;
  const flavor=(s.flavor_text_entries.find(x=>x.language.name==='ja')?.flavor_text||'').replace(/[\n\f]/g,' ');
  const data={...p,jp,flavor};
  cache.set(q,data);
  cache.set(String(p.id),data);
  cache.set(p.name,data);
  cache.set(jp,data);
  return data;
}

function typePills(p){
  return p.types.map(t=>`<span class="pill">${TYPE[t.type.name]||t.type.name}</span>`).join('');
}

function card(p){
  return `<button class="card" data-name="${p.name}">
    <div class="art"><img loading="lazy" src="${sprite(p)}" alt="${p.jp}"></div>
    <div class="num">NO.${String(p.id).padStart(4,'0')}</div>
    <div class="name">${p.jp}</div>
    <div class="en">${p.name}</div>
    <div class="types">${typePills(p)}</div>
  </button>`;
}

async function load(){
  try{
    const ps=await Promise.all(PICKS.map(getPokemon));
    grid.innerHTML=ps.map(card).join('');
  }catch(e){
    grid.innerHTML='<div class="empty">通信に失敗しました。<br>RETRY LATER.</div>';
  }
}

function show(p){
  const stats=p.stats.map(s=>`<div class="stat">
    <span>${STAT[s.stat.name]||s.stat.name}</span>
    <b>${s.base_stat}</b>
    <div class="bar"><i style="width:${Math.min(100,s.base_stat/1.8)}%"></i></div>
  </div>`).join('');
  detail.innerHTML=`
    <div class="detail-top">
      <div class="detail-img"><img src="${sprite(p)}" alt="${p.jp}"></div>
      <div>
        <div class="num">NO.${String(p.id).padStart(4,'0')}</div>
        <h1>${p.jp}</h1>
        <div class="meta">${p.name}</div>
        <div class="types">${typePills(p)}</div>
      </div>
    </div>
    ${p.flavor?`<div class="flavor">${p.flavor}</div>`:''}
    <div class="facts">
      <div class="fact"><b>HEIGHT</b><span>${(p.height/10).toFixed(1)} m</span></div>
      <div class="fact"><b>WEIGHT</b><span>${(p.weight/10).toFixed(1)} kg</span></div>
    </div>
    <div class="stats"><h3>BASE STATUS</h3>${stats}</div>`;
  overlay.classList.add('show');
  document.body.style.overflow='hidden';
}

async function openPokemon(q){
  error.style.display='none';
  try{
    show(await getPokemon(q));
  }catch(e){
    error.textContent='NOT FOUND / 英名または図鑑番号で検索してください。';
    error.style.display='block';
  }
}

grid.addEventListener('click',e=>{
  const c=e.target.closest('.card');
  if(c) openPokemon(c.dataset.name);
});

$('#searchForm').addEventListener('submit',e=>{
  e.preventDefault();
  const q=$('#searchInput').value;
  if(q.trim()) openPokemon(q);
});

function close(){
  overlay.classList.remove('show');
  document.body.style.overflow='';
}
$('#close').onclick=close;
overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
load();
</script>
</body>
</html>
